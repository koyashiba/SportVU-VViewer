name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: FFmpeg + Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - name: FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: FFmpeg version
        run: ffmpeg -version | head -1
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  hosted-model-smoke:
    name: pinned model via Roboflow hosted inference
    runs-on: ubuntu-latest
    needs: tests
    env:
      ROBOFLOW_API_KEY: ${{ secrets.RF_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secret
        id: key
        run: |
          if [ -n "$ROBOFLOW_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "RF_API_KEY secret not available (forks/PRs); skipping"; fi
      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: FFmpeg
        if: steps.key.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        if: steps.key.outputs.present == 'true'
        run: pip install -e .
      - name: Run the pinned model on a panning clip built from a public dataset frame
        if: steps.key.outputs.present == 'true'
        run: python scripts/model_smoke.py --backend roboflow_hosted --out smoke_run_hosted
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.present == 'true' && always()
        with:
          name: smoke_run_hosted
          path: smoke_run_hosted
          if-no-files-found: ignore
